name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          https://zbyzbiyozxvwamqrnjpb.supabase.co/rest/v1/
